[project]
name = "enterprise-documentation-assistant"
version = "0.1.0"
description = "An enterprise-style documentation assistant using LLMs and RAG"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.10.17",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
